version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=finance_db
    ports:
      - "5432:5432"
    networks:
      - finance-network

  auth_service:
    build: ./auth_service
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./auth_service:/app
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/finance_db
      - SECRET_KEY=supersecretkey
      - ALGORITHM=HS256
    depends_on:
      - db
    networks:
      - finance-network

  transaction_service:
    build: ./transaction_service
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./transaction_service:/app
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/finance_db
      - AUTH_SERVICE_URL=http://auth_service:8000
    depends_on:
      - db
      - auth_service
    networks:
      - finance-network

  analytics_service:
    build: ./analytics_service
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./analytics_service:/app
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/finance_db
    depends_on:
      - db
      - transaction_service
    networks:
      - finance-network

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:5173" # Vite default port
    environment:
      - VITE_AUTH_API_URL=http://localhost:8001
      - VITE_TRANSACTION_API_URL=http://localhost:8002
      - VITE_ANALYTICS_API_URL=http://localhost:8003
    depends_on:
      - auth_service
      - transaction_service
      - analytics_service
    networks:
      - finance-network

volumes:
  postgres_data:

networks:
  finance-network:
    driver: bridge
